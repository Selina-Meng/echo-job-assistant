<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">从自己的需求开始 · Echo 1.0 功能演示</title><style>text{font-family:'Microsoft YaHei',system-ui,sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1440" height="1000" rx="28" fill="#f4f2e9" stroke="none"/><text x="64" y="68" font-size="22" fill="#6c8177" font-weight="600">回声 ECHO / 1.0</text><text x="64" y="125" font-size="39" fill="#304c46" font-weight="600">从自己的需求开始</text><text x="64" y="170" font-size="24" fill="#63766d" font-weight="400">先想清楚想要什么，再把看到的岗位留下来。</text><rect x="48" y="208" width="1344" height="718" rx="24" fill="#fbfcf8" stroke="#d4dfd2"/><rect x="76" y="232" width="130" height="51" rx="25" fill="#406653" stroke="none"/><text x="115" y="267" font-size="25" fill="#fff" font-weight="400">需求</text><rect x="221" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="260" y="267" font-size="25" fill="#6a7b6d" font-weight="400">采集</text><rect x="366" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="405" y="267" font-size="25" fill="#6a7b6d" font-weight="400">判断</text><rect x="511" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="550" y="267" font-size="25" fill="#6a7b6d" font-weight="400">记录</text><rect x="656" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="695" y="267" font-size="25" fill="#6a7b6d" font-weight="400">总结</text><rect x="78" y="313" width="715" height="563" rx="18" fill="#fff" stroke="#dbe3da"/><text x="106" y="359" font-size="25" fill="#304c46" font-weight="400">点击标签填入修改，也可直接输入。</text><rect x="106" y="387" width="657" height="104" rx="18" fill="#fafbf7" stroke="#dbe3da"/><text x="127" y="426" font-size="24" fill="#304c46" font-weight="400">想找广州的采购岗位，月薪至少 8k。</text><text x="127" y="465" font-size="24" fill="#304c46" font-weight="400">希望有成长空间，可以偶尔出差。</text><rect x="641" y="509" width="121" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="659" y="538" font-size="21" fill="#486b52" font-weight="400">分析</text><text x="106" y="589" font-size="25" fill="#304c46" font-weight="600">确认后，整理成自己的求职标签</text><rect x="106" y="620" width="251" height="44" rx="22" fill="#f7e9e5" stroke="none"/><text x="124" y="649" font-size="21" fill="#995d52" font-weight="400">硬要求 · 月薪 ≥ 8k</text><rect x="377" y="620" width="240" height="44" rx="22" fill="#f7e9e5" stroke="none"/><text x="395" y="649" font-size="21" fill="#995d52" font-weight="400">硬要求 · 广州</text><rect x="106" y="681" width="264" height="44" rx="22" fill="#e9eff7" stroke="none"/><text x="124" y="710" font-size="21" fill="#536e91" font-weight="400">软偏好 · 成长空间</text><rect x="391" y="681" width="266" height="44" rx="22" fill="#e9eff7" stroke="none"/><text x="409" y="710" font-size="21" fill="#536e91" font-weight="400">软偏好 · 偶尔出差</text><text x="106" y="795" font-size="22" fill="#304c46" font-weight="400">问答帮助补全含义，硬或软由你确认。</text><text x="106" y="834" font-size="22" fill="#304c46" font-weight="400">以后也能删除、修改，不必一次想全。</text><rect x="818" y="313" width="543" height="563" rx="18" fill="#fff" stroke="#dbe3da"/><text x="849" y="360" font-size="26" fill="#304c46" font-weight="600">接着，保存感兴趣的岗位</text><rect x="849" y="398" width="211" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="867" y="427" font-size="21" fill="#486b52" font-weight="400">抓取当前</text><text x="849" y="473" font-size="23" fill="#304c46" font-weight="400">读取正在看的岗位详情</text><rect x="849" y="507" width="211" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="867" y="536" font-size="21" fill="#486b52" font-weight="400">抓取列表</text><text x="849" y="579" font-size="23" fill="#304c46" font-weight="400">支持收藏、应聘记录和搜索列表</text><text x="849" y="618" font-size="23" fill="#304c46" font-weight="400">按页面继续翻页，合并相同岗位</text><rect x="849" y="664" width="211" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="867" y="693" font-size="21" fill="#486b52" font-weight="400">抓取当前聊天</text><rect x="1080" y="664" width="248" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="1098" y="693" font-size="21" fill="#486b52" font-weight="400">抓取聊天</text><text x="849" y="758" font-size="23" fill="#304c46" font-weight="400">保存沟通，再按进展分类。</text><text x="849" y="797" font-size="23" fill="#304c46" font-weight="400">未读到的信息会提示补充。</text><text x="64" y="969" font-size="19" fill="#7e8c7f" font-weight="400">功能演示 · 以 1.0 的页面与操作为依据</text></svg>