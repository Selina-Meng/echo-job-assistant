<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title"><title id="title">少一点重复整理，多一点明确行动</title><rect width="1120" height="480" rx="24" fill="#f5f3ed"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#304b45}.small{font-size:20px;fill:#637970}.label{font-size:25px;font-weight:600}</style><text x="48" y="65" font-size="34" font-weight="600">少一点重复整理，多一点明确行动</text><text x="48" y="105" class="small">岗位与沟通放在一起，你来决定下一步。</text><rect x="48" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="70" y="196" class="small">01</text><text x="70" y="245" class="label">收集岗位</text><text x="70" y="295" class="small">保存详情与来源</text><text x="70" y="329" class="small">同一岗位持续更新</text><text x="290" y="264" font-size="20">›</text><rect x="310" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="332" y="196" class="small">02</text><text x="332" y="245" class="label">双向判断</text><text x="332" y="295" class="small">我符合岗位吗？</text><text x="332" y="329" class="small">岗位符合我吗？</text><text x="552" y="264" font-size="20">›</text><rect x="572" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="594" y="196" class="small">03</text><text x="594" y="245" class="label">准备沟通</text><text x="594" y="295" class="small">真实经历形成亮点</text><text x="594" y="329" class="small">生成后检查与修改</text><text x="814" y="264" font-size="20">›</text><rect x="834" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="856" y="196" class="small">04</text><text x="856" y="245" class="label">记录与复盘</text><text x="856" y="295" class="small">跟进状态与下一步</text><text x="856" y="329" class="small">回顾已经做过的事</text><text x="48" y="438" class="small">ECHO / 回声　·　功能示意　·　由你判断与确认</text></svg>