<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">沟通继续，记录也跟着更新 · Echo 1.0 功能演示</title><style>text{font-family:'Microsoft YaHei',system-ui,sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1440" height="1000" rx="28" fill="#f4f2e9" stroke="none"/><text x="64" y="68" font-size="22" fill="#6c8177" font-weight="600">回声 ECHO / 1.0</text><text x="64" y="125" font-size="39" fill="#304c46" font-weight="600">沟通继续，记录也跟着更新</text><text x="64" y="170" font-size="24" fill="#63766d" font-weight="400">不必靠记忆反复翻找，也能看见已经做过的努力。</text><rect x="48" y="208" width="1344" height="718" rx="24" fill="#fbfcf8" stroke="#d4dfd2"/><rect x="76" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="115" y="267" font-size="25" fill="#6a7b6d" font-weight="400">需求</text><rect x="221" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="260" y="267" font-size="25" fill="#6a7b6d" font-weight="400">采集</text><rect x="366" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="405" y="267" font-size="25" fill="#6a7b6d" font-weight="400">判断</text><rect x="511" y="232" width="130" height="51" rx="25" fill="#406653" stroke="none"/><text x="550" y="267" font-size="25" fill="#fff" font-weight="400">记录</text><rect x="656" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="695" y="267" font-size="25" fill="#6a7b6d" font-weight="400">总结</text><rect x="79" y="313" width="1282" height="287" rx="18" fill="#fff" stroke="#dbe3da"/><text x="110" y="358" font-size="28" fill="#304c46" font-weight="600">岗位记录</text><rect x="105" y="383" width="1230" height="48" rx="8" fill="#edf3e9" stroke="none"/><text x="123" y="416" font-size="23" fill="#304c46" font-weight="400">岗位 / 公司</text><text x="571" y="416" font-size="23" fill="#304c46" font-weight="400">薪资 / 地点</text><text x="872" y="416" font-size="23" fill="#304c46" font-weight="400">沟通进度</text><text x="1119" y="416" font-size="23" fill="#304c46" font-weight="400">备注</text><text x="123" y="471" font-size="24" fill="#304c46" font-weight="400">采购专员 · 南禾贸易</text><text x="571" y="471" font-size="23" fill="#304c46" font-weight="400">8–12k / 广州</text><text x="872" y="471" font-size="23" fill="#304c46" font-weight="400">已准备话术</text><text x="1119" y="471" font-size="22" fill="#304c46" font-weight="400">核对出差频率</text><text x="123" y="531" font-size="24" fill="#304c46" font-weight="400">采购助理 · 青禾商贸</text><text x="571" y="531" font-size="23" fill="#304c46" font-weight="400">8–10k / 广州</text><text x="872" y="531" font-size="23" fill="#304c46" font-weight="400">等待 HR</text><text x="1119" y="531" font-size="22" fill="#304c46" font-weight="400">保留聊天关联</text><text x="111" y="575" font-size="21" fill="#6b7d70" font-weight="400">还可查看：岗位 JD · 多维评分 · HR 活跃 · 来源 · 已保存话术</text><rect x="79" y="625" width="624" height="242" rx="18" fill="#fff" stroke="#dbe3da"/><text x="110" y="670" font-size="26" fill="#304c46" font-weight="600">抓取聊天后，知道下一步</text><rect x="110" y="697" width="244" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="128" y="726" font-size="21" fill="#486b52" font-weight="400">待我回复</text><rect x="370" y="697" width="246" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="388" y="726" font-size="21" fill="#486b52" font-weight="400">建议跟进</text><text x="110" y="784" font-size="23" fill="#304c46" font-weight="400">可靠消息用于更新进展；缺少时间或身份时，</text><text x="110" y="823" font-size="23" fill="#304c46" font-weight="400">先留在“需要确认”，避免误判。</text><rect x="729" y="625" width="632" height="242" rx="18" fill="#fff" stroke="#dbe3da"/><text x="760" y="670" font-size="26" fill="#304c46" font-weight="600">总结里，回顾自己的节奏</text><text x="760" y="723" font-size="24" fill="#304c46" font-weight="400">看本周行动、进展图表和求职画像，</text><text x="760" y="762" font-size="24" fill="#304c46" font-weight="400">整理下一步，也给自己一些鼓励。</text><rect x="767" y="818" width="49" height="24" rx="6" fill="#a9c3a6" stroke="none"/><rect x="855" y="802.5" width="49" height="39.5" rx="6" fill="#a9c3a6" stroke="none"/><rect x="943" y="787" width="49" height="55" rx="6" fill="#a9c3a6" stroke="none"/><rect x="1031" y="768.5" width="49" height="73.5" rx="6" fill="#a9c3a6" stroke="none"/><rect x="1119" y="782.5" width="49" height="59.5" rx="6" fill="#a9c3a6" stroke="none"/><rect x="1207" y="757" width="49" height="85" rx="6" fill="#a9c3a6" stroke="none"/><text x="64" y="969" font-size="19" fill="#7e8c7f" font-weight="400">功能演示 · 以 1.0 的页面与操作为依据</text></svg>