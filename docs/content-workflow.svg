<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title"><title id="title">每条话术都有来路</title><rect width="1120" height="480" rx="24" fill="#f5f3ed"/><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#304b45}.small{font-size:20px;fill:#637970}.label{font-size:25px;font-weight:600}</style><text x="48" y="65" font-size="34" font-weight="600">每条话术都有来路</text><text x="48" y="105" class="small">保留依据、草稿与检查结果，发现问题才有地方改。</text><rect x="48" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="70" y="196" class="small">01</text><text x="70" y="245" class="label">真实资料</text><text x="70" y="295" class="small">岗位要求</text><text x="70" y="329" class="small">经历与上下文</text><text x="290" y="264" font-size="20">›</text><rect x="310" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="332" y="196" class="small">02</text><text x="332" y="245" class="label">明确策略</text><text x="332" y="295" class="small">配对要求与经历</text><text x="332" y="329" class="small">提炼相关亮点</text><text x="552" y="264" font-size="20">›</text><rect x="572" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="594" y="196" class="small">03</text><text x="594" y="245" class="label">生成与检验</text><text x="594" y="295" class="small">自然表达匹配度</text><text x="594" y="329" class="small">必要时修改</text><text x="814" y="264" font-size="20">›</text><rect x="834" y="155" width="238" height="228" rx="18" fill="#fff" stroke="#d1ddd3"/><text x="856" y="196" class="small">04</text><text x="856" y="245" class="label">人工确认</text><text x="856" y="295" class="small">核对事实再使用</text><text x="856" y="329" class="small">写回原岗位记录</text><text x="48" y="438" class="small">ECHO / 回声　·　功能示意　·　由你判断与确认</text></svg>