<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title"><title id="title">逐个判断，找到想继续的机会 · Echo 1.0 功能演示</title><style>text{font-family:'Microsoft YaHei',system-ui,sans-serif}*{box-sizing:border-box}</style><rect x="0" y="0" width="1440" height="1000" rx="28" fill="#f4f2e9" stroke="none"/><text x="64" y="68" font-size="22" fill="#6c8177" font-weight="600">回声 ECHO / 1.0</text><text x="64" y="125" font-size="39" fill="#304c46" font-weight="600">逐个判断，找到想继续的机会</text><text x="64" y="170" font-size="24" fill="#63766d" font-weight="400">把匹配理由放在眼前，留给自己决定。</text><rect x="48" y="208" width="1344" height="718" rx="24" fill="#fbfcf8" stroke="#d4dfd2"/><rect x="76" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="115" y="267" font-size="25" fill="#6a7b6d" font-weight="400">需求</text><rect x="221" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="260" y="267" font-size="25" fill="#6a7b6d" font-weight="400">采集</text><rect x="366" y="232" width="130" height="51" rx="25" fill="#406653" stroke="none"/><text x="405" y="267" font-size="25" fill="#fff" font-weight="400">判断</text><rect x="511" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="550" y="267" font-size="25" fill="#6a7b6d" font-weight="400">记录</text><rect x="656" y="232" width="130" height="51" rx="25" fill="#fbfcf8" stroke="none"/><text x="695" y="267" font-size="25" fill="#6a7b6d" font-weight="400">总结</text><rect x="79" y="312" width="229" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="97" y="341" font-size="21" fill="#486b52" font-weight="400">待判断岗位（3）</text><rect x="329" y="312" width="204" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="347" y="341" font-size="21" fill="#486b52" font-weight="400">候选清单（2）</text><rect x="553" y="312" width="201" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="571" y="341" font-size="21" fill="#486b52" font-weight="400">流程中（4）</text><rect x="774" y="312" width="224" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="792" y="341" font-size="21" fill="#486b52" font-weight="400">需要确认（1）</text><rect x="1018" y="312" width="207" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="1036" y="341" font-size="21" fill="#486b52" font-weight="400">回收站（2）</text><rect x="79" y="385" width="1282" height="483" rx="18" fill="#fff" stroke="#dbe3da"/><text x="111" y="435" font-size="32" fill="#304c46" font-weight="600">采购专员</text><text x="111" y="478" font-size="25" fill="#63766d" font-weight="400">南禾贸易 · 广州 · 8–12k · 1–3年</text><rect x="111" y="513" width="263" height="44" rx="22" fill="#f7e9e5" stroke="none"/><text x="129" y="542" font-size="21" fill="#995d52" font-weight="400">硬要求 · 符合</text><rect x="391" y="513" width="432" height="44" rx="22" fill="#e9eff7" stroke="none"/><text x="409" y="542" font-size="21" fill="#536e91" font-weight="400">软偏好 · 成长空间待确认</text><rect x="111" y="581" width="184" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="129" y="610" font-size="21" fill="#486b52" font-weight="400">暂不考虑</text><rect x="312" y="581" width="184" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="330" y="610" font-size="21" fill="#486b52" font-weight="400">加入候选</text><rect x="513" y="581" width="184" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="531" y="610" font-size="21" fill="#486b52" font-weight="400">打开来源</text><rect x="714" y="581" width="184" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="732" y="610" font-size="21" fill="#486b52" font-weight="400">展开详情</text><rect x="915" y="581" width="223" height="44" rx="22" fill="#e8f0e7" stroke="none"/><text x="933" y="610" font-size="21" fill="#486b52" font-weight="400">★ 综合评分 4.1</text><rect x="111" y="659" width="1218" height="171" rx="18" fill="#f8faf5" stroke="#dbe3da"/><text x="135" y="702" font-size="25" fill="#304c46" font-weight="600">我符合岗位吗</text><text x="708" y="702" font-size="25" fill="#304c46" font-weight="600">岗位符合我吗</text><text x="135" y="748" font-size="23" fill="#304c46" font-weight="400">采购文件、供应商沟通经验与职责对应。</text><text x="135" y="787" font-size="23" fill="#304c46" font-weight="400">仍需确认是否要求特定行业经验。</text><text x="708" y="748" font-size="23" fill="#304c46" font-weight="400">薪资与城市符合已确认的要求。</text><text x="708" y="787" font-size="23" fill="#304c46" font-weight="400">JD 提到培训，成长机会仍需进一步了解。</text><text x="64" y="969" font-size="19" fill="#7e8c7f" font-weight="400">功能演示 · 以 1.0 的页面与操作为依据</text></svg>